<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADVuxeMej3mYo3VutAwTeb5oK1uIrLYpo",
    authDomain: "maquis-78101.firebaseapp.com",
    projectId: "maquis-78101",
    storageBucket: "maquis-78101.firebasestorage.app",
    messagingSenderId: "722208873307",
    appId: "1:722208873307:web:933dd9662c95c4e486d87e"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  window.fb = {
    registrar: (email, pass) => createUserWithEmailAndPassword(auth, email, pass),
    iniciarSesion: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
    iniciarSesionGoogle: () => signInWithPopup(auth, googleProvider),
    cerrarSesion: () => signOut(auth),
    cambiarPassword: async (passActual, passNueva) => {
      const user = auth.currentUser;
      if(!user || !user.email) throw new Error('sin-sesion');
      const cred = EmailAuthProvider.credential(user.email, passActual);
      await reauthenticateWithCredential(user, cred);
      await updatePassword(user, passNueva);
    },
    onAuthChange: (cb) => onAuthStateChanged(auth, cb),
    recuperarPassword: (email) => sendPasswordResetEmail(auth, email),

    leerUsuario: async (uid) => {
      const snap = await getDoc(doc(db, 'usuarios', uid));
      return snap.exists() ? snap.data() : null;
    },
    guardarUsuario: (uid, datos) => setDoc(doc(db, 'usuarios', uid), datos, { merge: true }),
    listarVendedores: async (tiendaId) => {
      const q = query(collection(db, 'usuarios'), where('tiendaId', '==', tiendaId));
      const snap = await getDocs(q);
      const out = [];
      snap.forEach(d => { const datos = d.data(); if(datos.rol !== 'propietario') out.push({ uid: d.id, ...datos }); });
      return out;
    },

    crearTienda: async (tiendaId, datos) => setDoc(doc(db, 'tiendas', tiendaId), datos),
    actualizarTienda: async (tiendaId, datos) => setDoc(doc(db, 'tiendas', tiendaId), datos, { merge: true }),
    crearCadena: async (cadenaId, datos) => setDoc(doc(db, 'cadenas', cadenaId), datos),
    actualizarCadena: async (cadenaId, datos) => setDoc(doc(db, 'cadenas', cadenaId), datos, { merge: true }),
    leerCadena: async (cadenaId) => {
      const snap = await getDoc(doc(db, 'cadenas', cadenaId));
      return snap.exists() ? snap.data() : null;
    },
    leerTienda: async (tiendaId) => {
      const snap = await getDoc(doc(db, 'tiendas', tiendaId));
      return snap.exists() ? snap.data() : null;
    },
    eliminarTienda: async (tiendaId) => {
      await deleteDoc(doc(db, 'tiendas', tiendaId, 'negocio', 'main'));
      await deleteDoc(doc(db, 'tiendas', tiendaId));
    },

    guardarDatosTienda: (tiendaId, dataObj) => setDoc(doc(db, 'tiendas', tiendaId, 'negocio', 'main'), { json: JSON.stringify(dataObj) }),
    leerDatosTienda: async (tiendaId) => {
      const snap = await getDoc(doc(db, 'tiendas', tiendaId, 'negocio', 'main'));
      return snap.exists() ? snap.data().json : null;
    },

    // Crea una cuenta de vendedor SIN cerrar la sesión del propietario (usa una instancia temporal de Firebase)
    crearVendedor: async (email, pass, datosUsuario) => {
      const tempApp = initializeApp(firebaseConfig, 'temp-' + Date.now());
      const tempAuth = getAuth(tempApp);
      try{
        const cred = await createUserWithEmailAndPassword(tempAuth, email, pass);
        const newUid = cred.user.uid;
        await setDoc(doc(db, 'usuarios', newUid), datosUsuario);
        await signOut(tempAuth);
        await deleteApp(tempApp);
        return newUid;
      }catch(e){
        await deleteApp(tempApp);
        throw e;
      }
    }
  };
  window.dispatchEvent(new Event('fbListo'));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430; --ink-soft:#4a5568; --ink-faint:#8a94a3;
    --paper:#fffdf5; --card:#ffffff; --line:#e8e4cf;
    --cream:#F9F8DC; --cream-deep:#f0eec4;
    --primary:#0561A9; --primary-soft:rgba(5,97,169,0.12); --primary-icon:rgba(5,97,169,0.35); --primary-deep:#044880;
    --moss:#0561A9; --moss-soft:rgba(5,97,169,0.12); --moss-deep:#044880;
    --rust:#c1443a; --rust-soft:#fbe6e4;
    --gold:#b8862e; --gold-soft:#f6ecd6;
    --radius:14px;
    --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', 'Roboto Mono', ui-monospace, monospace;
    --elev1: 0 1px 3px rgba(5,30,60,.10), 0 1px 2px rgba(5,30,60,.14);
    --elev2: 0 3px 8px rgba(5,30,60,.14), 0 1px 3px rgba(5,30,60,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#ece7db; --ink-soft:#b9b2a0; --ink-faint:#7d7666;
      --paper:#12161c; --card:#1a2029; --line:#283040;
      --cream:#1a2029; --cream-deep:#232b38;
      --primary:#5aa6e0; --primary-soft:rgba(90,166,224,0.14); --primary-icon:rgba(90,166,224,0.4); --primary-deep:#3d84ba;
      --moss:#5aa6e0; --moss-soft:rgba(90,166,224,0.14); --moss-deep:#3d84ba;
      --rust:#e0796d; --rust-soft:#33201a;
      --gold:#dcb15c; --gold-soft:#332a15;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;background:var(--cream);border-radius:var(--radius);padding:16px 18px;gap:10px;flex-wrap:wrap;box-shadow:var(--elev1);}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .b1{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:0.01em;}
  .brand .b2{font-size:11px;font-weight:700;color:var(--primary);letter-spacing:0.28em;margin-top:3px;}
  .brand-badges{display:flex;gap:6px;align-items:center;margin-top:6px;}
  header p{margin:2px 0 0;color:var(--ink-soft);font-size:12px;}
  .btn-excel{background:var(--gold);white-space:nowrap;flex:0 0 auto;}
  .btn-tool{background:transparent;border:1.5px solid var(--gold);color:var(--gold);box-shadow:none;}
  .help-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-height:auto;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800;padding:0;box-shadow:none;vertical-align:middle;margin-left:4px;cursor:pointer;}
  .tabs{display:flex;gap:4px;margin-bottom:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;flex:1;min-width:0;}
  .tabs-row{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
  .avatar-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--elev1);flex:0 0 auto;padding:0;min-height:auto;}
  .menu-perfil{display:none;position:absolute;top:48px;right:0;z-index:20;background:var(--card);border-radius:var(--radius);box-shadow:var(--elev2);padding:14px;width:200px;}
  .menu-perfil.open{display:block;}
  .menu-toggle{display:flex;align-items:center;gap:5px;padding:9px 14px;border:none;border-radius:999px;background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:var(--elev1);flex:0 0 auto;white-space:nowrap;}
  .menu-toggle svg{width:15px;height:15px;stroke:var(--primary-icon);}
  .menu-toggle.open{background:var(--primary);color:#fff;}
  .menu-toggle.open svg{stroke:#fff;}
  .menu-mas{display:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--elev2);padding:14px;margin-bottom:14px;}
  .menu-mas.open{display:block;}
  .menu-mas-group{margin-bottom:12px;}
  .menu-mas-group:last-child{margin-bottom:0;}
  .menu-mas-group.vacio{display:none;}
  .menu-mas-title{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);font-weight:700;margin-bottom:6px;}
  .menu-mas .tab{display:inline-flex;margin:0 6px 6px 0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{display:flex;align-items:center;gap:6px;padding:9px 14px;border:none;border-radius:999px;background:var(--card);color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;flex:0 0 auto;white-space:nowrap;box-shadow:var(--elev1);transition:background .15s,color .15s;}
  .tab svg{width:16px;height:16px;stroke:var(--primary-icon);flex:0 0 auto;}
  .tab.active{background:var(--primary);color:#fff;}
  .tab.active svg{stroke:#fff;}
  .panel{display:none;}
  .panel.active{display:block;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .metric{background:var(--card);border:none;border-radius:var(--radius);padding:12px 14px;box-shadow:var(--elev1);}
  .metric .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);margin-bottom:4px;}
  .metric .val{font-family:var(--mono);font-size:18px;font-weight:700;word-break:break-word;}
  .metric.pos .val{color:var(--moss);}
  .metric.neg .val{color:var(--rust);}
  .card{background:var(--card);border:none;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--elev1);}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:800;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
  input,select{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:14px;font-family:var(--sans);min-height:44px;transition:border-color .15s;}
  input:focus,select:focus{outline:none;border-color:var(--primary);}
  input[type=checkbox]{flex:0 0 auto;width:20px;height:20px;min-height:20px;padding:0;accent-color:var(--primary);}
  input[type=date]{min-width:130px;}
  button{padding:11px 18px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);min-height:44px;box-shadow:var(--elev1);transition:transform .1s,box-shadow .1s;}
  button:active{transform:scale(0.97);box-shadow:none;}
  button.secondary{background:transparent;border:1.5px solid var(--primary);color:var(--primary);box-shadow:none;}
  button.danger{background:transparent;border:1.5px solid var(--rust);color:var(--rust);padding:7px 10px;font-size:12px;min-height:36px;box-shadow:none;}
  button.mini{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);padding:7px 10px;font-size:12px;min-height:36px;box-shadow:none;}
  button.scan{background:var(--gold);flex:0 0 auto;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);color:var(--ink-faint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;}
  td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  .center{text-align:center;}
  .code{font-family:var(--mono);font-size:12px;background:var(--gold-soft);color:var(--gold);padding:2px 6px;border-radius:4px;white-space:nowrap;}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .tag.low{background:var(--rust-soft);color:var(--rust);}
  .tag.ok{background:var(--moss-soft);color:var(--moss-deep);}
  .tag.edit{background:var(--gold-soft);color:var(--gold);cursor:pointer;}
  .empty{color:var(--ink-faint);font-size:13px;padding:14px 0;text-align:center;}
  .hint{color:var(--ink-faint);font-size:12px;margin-top:-4px;margin-bottom:12px;}
  .field-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .field-group label{margin-bottom:2px;}
  .field-group .hint{margin-top:2px;margin-bottom:0;}
  .accordion-body .card h3,.accordion-body h3{margin-top:0;}
  .field-group label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .check-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);padding:2px 0;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--primary-soft);border-radius:var(--radius);}
  .filters input,.filters select{background:var(--card);}
  .filters span{font-size:11px;color:var(--ink-faint);align-self:center;}
  .actions{display:flex;gap:4px;flex-wrap:wrap;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,35,0.55);z-index:50;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--card);border-radius:var(--radius);padding:20px;max-width:400px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--elev2);}
  .modal-box h3{margin-top:0;}
  .modal-box .row{justify-content:flex-end;margin-top:14px;}
  #scanner-video{width:100%;border-radius:8px;background:#000;display:block;}
  .accordion{border:none;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--elev1);}
  .accordion-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;background:var(--card);font-size:14px;font-weight:800;}
  .accordion-head .chev{transition:transform 0.2s;color:var(--ink-faint);font-size:12px;}
  .accordion.open .accordion-head .chev{transform:rotate(180deg);}
  .accordion-body{display:none;padding:14px 16px 16px;}
  .accordion.open .accordion-body{display:block;}
  .ticket{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:16px;}
  .ticket .tline{display:flex;justify-content:space-between;}
  .ticket hr{border:none;border-top:1px dashed var(--line);margin:8px 0;}
  .pass-wrap{flex:1;min-width:0;display:flex;align-items:stretch;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);}
  .pass-wrap:focus-within{border-color:var(--primary);}
  .pass-wrap input{flex:1;border:none;background:transparent;border-radius:0;min-width:0;}
  .pass-wrap input:focus{outline:none;}
  .pass-toggle{position:static;background:var(--primary-soft);box-shadow:none;color:var(--primary);padding:0;min-height:44px;width:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;border-radius:0;order:-1;}
  .pass-toggle:active{transform:scale(0.92);}
  .pass-toggle svg{width:20px;height:20px;}
  .btn-google{background:#fff;color:#3c4043;border:1.5px solid var(--line);}
  .role-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;background:var(--primary-soft);color:var(--primary);}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;}
  }
  @media (max-width: 640px){
    .wrap{padding:14px 10px 70px;}
    header{flex-direction:row;}
    .brand .b1{font-size:20px;}
    .row{flex-direction:column;align-items:stretch;}
    .row input,.row select,.row button{width:100%;}
    .row .avatar-btn{width:40px;flex:0 0 auto;}
    .row input[type=checkbox]{width:20px;align-self:flex-start;}
    .check-line{align-self:flex-start;}
    .filters{flex-direction:column;align-items:stretch;}
    .card{padding:12px;}
    .cards{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap" id="auth-screen" style="max-width:400px;padding-top:60px;">
  <div class="card" style="text-align:center;">
    <div class="brand" style="align-items:center;margin-bottom:4px;">
      <span class="b1">MAQUI</span>
      <span class="b2">INVENTORY</span>
    </div>
    <p class="hint" style="margin:10px 0 18px;">Iniciá sesión o creá tu cuenta</p>
    <div class="row"><input type="email" id="auth-email" placeholder="Correo electrónico"></div>
    <div class="row">
      <div class="pass-wrap">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <button type="button" class="pass-toggle" onclick="togglePassView('auth-pass', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>

    <div class="row" style="flex-direction:column;">
      <button onclick="hacerLogin()">Iniciar sesión</button>
      <button class="secondary" onclick="abrirFormularioRegistro()">Crear cuenta nueva</button>
      <button class="mini" style="align-self:center;" onclick="hacerRecuperarPassword()">¿Olvidaste tu contraseña?</button>
      <button class="btn-google" onclick="hacerLoginGoogle()">
        <span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.2-7.2 2.2-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.6 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C40.9 36 43.5 30.5 43.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>
          Continuar con Google
        </span>
      </button>
    </div>
  </div>
</div>

<div class="wrap" id="app-screen" style="display:none;">
  <header>
    <div>
      <div class="brand">
        <span class="b1">MAQUI</span>
        <span class="b2">INVENTORY</span>
      </div>
      <div class="brand-badges">
        <span class="role-badge" id="badge-rol">—</span>
        <span class="hint" id="badge-tienda" style="margin:0;">—</span>
      </div>
    </div>
    <div class="row" style="flex:0 0 auto;gap:6px;position:relative;">
      <button class="avatar-btn" id="avatar-btn" onclick="toggleMenuPerfil()" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
      <di
